server {
    listen 80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    # Everything Vite fingerprints. The hash is in the filename, so a given URL's
    # bytes can never change and the response is safe to keep forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else — index.html, favicon, icons — carries no fingerprint.
    # Without an explicit freshness header a cache MAY invent a heuristic
    # expiry of roughly 10% of the response's age (RFC 9111 §4.2.2), and
    # index.html is exactly as old as the last deploy: a pod running for a
    # month would let a browser keep the previous deploy's entry point for
    # days. `no-store` is what makes a new deploy take effect on the next load.
    #
    # try_files is the SPA fallback — without it a refresh on /sign-in is a 404,
    # because only index.html exists on disk.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
