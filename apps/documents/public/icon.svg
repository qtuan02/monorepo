<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="@fe-monorepo">
  <!--
    The same mark the nav pill wears: a conic sweep through the five aurora
    stops of `src/globals.css`, in a rounded square. SVG has no conic gradient,
    so the sweep is five 72° wedges, each carrying a linear gradient between the
    two stops it sits between — at a favicon's size that reads as the one smooth
    sweep the CSS draws, and it stays sharp at every size a bitmap would not.

    Colours are literals because this file is outside the bundle: `public/` is
    served byte-for-byte and never sees a custom property. They are the aurora
    stops verbatim, and `test/icon.test.ts` holds them to the stylesheet — a stop
    renamed there would otherwise leave the nav mark and the tab a different
    colour, with nothing anywhere to say so.
  -->
  <defs>
    <clipPath id="squircle">
      <rect width="64" height="64" rx="21" ry="21"/>
    </clipPath>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="16" y1="59.71" x2="0.7" y2="25.35">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0.7" y1="25.35" x2="28.66" y2="0.18">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="28.66" y1="0.18" x2="61.23" y2="18.99">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="d" gradientUnits="userSpaceOnUse" x1="61.23" y1="18.99" x2="53.41" y2="55.78">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="e" gradientUnits="userSpaceOnUse" x1="53.41" y1="55.78" x2="16" y2="59.71">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#squircle)">
    <path fill="url(#a)" d="M32 32 0 87.42 -30.6 18.69Z"/>
    <path fill="url(#b)" d="M32 32 -30.6 18.69 25.31 -31.65Z"/>
    <path fill="url(#c)" d="M32 32 25.31 -31.65 90.47 5.97Z"/>
    <path fill="url(#d)" d="M32 32 90.47 5.97 74.82 79.56Z"/>
    <path fill="url(#e)" d="M32 32 74.82 79.56 0 87.42Z"/>
  </g>
</svg>
